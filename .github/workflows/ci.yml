name: "CI"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: "Lint & Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: "Install dependencies"
        run: bun install
      - name: "Run type checking"
        run: bun run lint
      - name: "Run tests"
        run: bun test
      - name: "Verify postinstall works"
        run: |
          export XDG_CONFIG_HOME=$(mktemp -d)
          node postinstall.js
          test -f "$XDG_CONFIG_HOME/opencode/plugins/opencode-plugin-template.js"
          echo "Postinstall verification passed"
