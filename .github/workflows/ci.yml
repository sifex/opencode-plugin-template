name: "CI"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  test:
    name: "Lint & Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: "Install dependencies"
        run: npm ci --ignore-scripts
      - name: "Run type checking"
        run: bun run lint
      - name: "Run tests"
        run: bun test
      - name: "Verify postinstall works"
        run: |
          export XDG_CONFIG_HOME=$(mktemp -d)
          node postinstall.js
          test -f "$XDG_CONFIG_HOME/opencode/plugins/opencode-plugin-template.js"
          echo "Postinstall verification passed"

  # ---------------------------------------------------------------------------
  # Package-manager integration. The sideloader must locate a globally
  # installed package in every supported system package manager, then expose
  # both OpenCode plugin contracts from the copied loader.
  # ---------------------------------------------------------------------------
  integration:
    name: "Integration (${{ matrix.manager }} ${{ matrix.version }} / Node ${{ matrix.node }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - manager: pnpm
            version: "9"
            node: "18"
          - manager: pnpm
            version: "10"
            node: "22"
          - manager: pnpm
            version: "11"
            node: "22"
          - manager: npm
            version: "10"
            node: "18"
          - manager: npm
            version: "11"
            node: "22"
          - manager: bun
            version: latest
            node: "22"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: "Set up package manager"
        run: |
          if [ "${{ matrix.manager }}" = pnpm ]; then
            npm install -g --force pnpm@${{ matrix.version }}
            mkdir -p "$HOME/.local/share/pnpm"
            echo "PNPM_HOME=$HOME/.local/share/pnpm" >> "$GITHUB_ENV"
            echo "$HOME/.local/share/pnpm" >> "$GITHUB_PATH"
            echo "$HOME/.local/share/pnpm/bin" >> "$GITHUB_PATH"
          elif [ "${{ matrix.manager }}" = npm ]; then
            npm install -g --force npm@${{ matrix.version }}
          fi

      - name: "Build and pack plugin"
        run: |
          npm ci --ignore-scripts
          bun run build
          npm pack

      - name: "Install the package globally"
        run: |
          TARBALL="$(pwd)/$(ls opencode-plugin-template-*.tgz)"
          if [ "${{ matrix.manager }}" = pnpm ]; then
            if [ "${{ matrix.version }}" = 9 ]; then
              pnpm add -g "$TARBALL"
            else
              pnpm add -g "$TARBALL" --allow-build=opencode-plugin-template
            fi
          elif [ "${{ matrix.manager }}" = npm ]; then
            npm install -g "$TARBALL"
          else
            bun add -g "$TARBALL"
          fi

      - name: "Verify loader contracts"
        run: |
          node --input-type=module -e '
            const plugin = (await import("./loader.js")).default;
            if (plugin?.id !== "opencode-plugin-template") throw new Error("plugin id mismatch");
            if (typeof plugin.server !== "function") throw new Error("missing V1 server contract");
            if (typeof plugin.setup !== "function") throw new Error("missing V2 setup contract");
          '

      - name: "Verify installed loader"
        run: |
          export XDG_CONFIG_HOME="$(mktemp -d)"
          node postinstall.js
          loader="$XDG_CONFIG_HOME/opencode/plugins/opencode-plugin-template.js"
          test -f "$loader"
          printf '{"type":"module"}\n' > "$XDG_CONFIG_HOME/opencode/plugins/package.json"
          LOADER="$loader" node --input-type=module -e '
            const plugin = (await import(process.env.LOADER)).default;
            if (typeof plugin.server !== "function" || typeof plugin.setup !== "function") throw new Error("installed loader has incomplete contracts");
          '

  # ---------------------------------------------------------------------------
  # OpenCode version matrix. Verifies the sideloader + loader works against
  # a spread of recent and older OpenCode releases plus the latest.
  #
  # The 1.10/1.11 series never shipped to npm — the oldest available is
  # 1.14.17, so that stands in for the "older release" boundary.
  # ---------------------------------------------------------------------------
  opencode-compat:
    name: "OpenCode ${{ matrix.generation }} (${{ matrix.opencode-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - generation: v1
            package: opencode-ai
            executable: opencode
            opencode-version: "1.14.17"
          - generation: v1
            package: opencode-ai
            executable: opencode
            opencode-version: "1.14.51"
          - generation: v1
            package: opencode-ai
            executable: opencode
            opencode-version: "1.15.13"
          - generation: v1
            package: opencode-ai
            executable: opencode
            opencode-version: "1.16.2"
          - generation: v1
            package: opencode-ai
            executable: opencode
            opencode-version: "1.17.8"
          - generation: v1
            package: opencode-ai
            executable: opencode
            opencode-version: latest
          - generation: v2
            package: "@opencode-ai/cli"
            executable: opencode2
            opencode-version: "0.0.0-next-17444"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: "Build and pack plugin"
        run: |
          npm ci --ignore-scripts
          bun run build
          npm pack

      - name: "Install OpenCode and plugin"
        run: |
          npm install -g --force ${{ matrix.package }}@${{ matrix.opencode-version }}
          TARBALL="$(pwd)/$(ls opencode-plugin-template-*.tgz)"
          npm install -g "$TARBALL"
          ${{ matrix.executable }} --version

      - name: "Verify OpenCode loads the plugin"
        run: |
          export XDG_CONFIG_HOME=$(mktemp -d)
          export XDG_DATA_HOME=$(mktemp -d)
          node postinstall.js
          test -f "$XDG_CONFIG_HOME/opencode/plugins/opencode-plugin-template.js"

          # `models` triggers full config evaluation including plugin
          # hooks; --print-logs streams the server log to stdout.
          if [ "${{ matrix.generation }}" = "v2" ]; then
            output=$(${{ matrix.executable }} models --standalone --log-level error 2>&1)
          else
            output=$(${{ matrix.executable }} models --print-logs --log-level DEBUG 2>&1)
          fi
          printf '%s\n' "$output"

          # The command must succeed. V1 debug logs additionally identify the
          # plugin; V2 does not log loaded plugin IDs from this command.
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "opencode models exited with code $rc" >&2
            exit 1
          fi

          if [ "${{ matrix.generation }}" = "v1" ]; then
            case "$output" in
              *opencode-plugin-template*)
                echo "OK: OpenCode ${{ matrix.opencode-version }} loaded the plugin" ;;
              *)
                echo "OpenCode ${{ matrix.opencode-version }} did not log the plugin id" >&2
                exit 1 ;;
            esac
          fi
